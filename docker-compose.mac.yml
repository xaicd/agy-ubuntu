# agy-ubuntu — Apple Silicon (macOS arm64) 版编排
#
# 与 docker-compose.yml 的差异:
#   * image 换成本地构建的 chw717/ai-agy:latest-arm64
#   * macOS 的 Docker Desktop 自带 /dev/net/tun 支持(VirtioFS 虚拟机内可用)
#   * 其余(TUN、NET_ADMIN、挂载、登录态持久化)与原版一致

services:
  agy-box:
    image: chw717/ai-agy:latest-arm64
    container_name: agy-ubuntu-container
    restart: always

    environment:
      TZ: Asia/Shanghai
      CLASH_URL: ${CLASH_URL:-}
      # npm 全局包装在持久化卷 /opt/agy-tools,bin 目录进 PATH
      PATH: /opt/agy-tools/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      NPM_CONFIG_PREFIX: /opt/agy-tools
      NPM_CONFIG_CACHE: /root/.npm

    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - ./workspace:/root/workspace
      # 宿主机仓库直挂(墨斗/雨蛙可直接读写真实代码,与宿主同步,免clone)
      - ${HOME}/workspace:/host-workspace
      # 持久化 agy 登录状态(重建容器不丢登录)
      - ./agy-home:/root/.gemini
      # 持久化全局 Claude 登录态、命令与 Skills
      - ./claude-home:/root/.claude
      # 宿主 claude 配置只读源(settings.json 软链指向 settings.jsonglm,entrypoint 首启播种用)
      - ${HOME}/.claude:/root/.claude-host:ro
      # 持久化 cmd(command-code) 配置与登录态(auth.json/providers.json)
      - ./cmd-home:/root/.commandcode
      # 宿主 cmd 配置只读源(entrypoint 首启播种 auth.json 用)
      - ${HOME}/.commandcode:/root/.commandcode-host:ro
      # 持久化 cmd 全局 skills
      - ./cmd-home-skills:/root/.cmd
      # 持久化 CLI 二进制本体(npm 全局包):容器重建不丢 claude/cmd/copilot
      # 用独立 prefix(/opt/agy-tools)而非 /usr/local——后者会把 npm 自身也卷进去,
      # 且 /usr/local/bin 的软链仍在可写层,重建即失效;独立 prefix + PATH 最干净
      - agy-tools:/opt/agy-tools
      # 持久化 npm 下载缓存(1.8GB):重建后免重下
      - agy-npm-cache:/root/.npm
      # 持久化 kiro-cli / agy 等 ~/.local/bin 二进制
      - agy-local-bin:/root/.local/bin
      # 持久化全局 Copilot 登录态与会话
      - ./copilot-home:/root/.copilot
      # 共享宿主机 Copilot 登录态
      - ${HOME}/.copilot:/root/.copilot-host:ro
      # 持久化全局 Kiro 登录态与配置
      - ./kiro-home:/root/.kiro
      # 共享宿主机 git 身份 + SSH 密钥
      - ${HOME}/.gitconfig:/root/.gitconfig-host:ro
      - ${HOME}/.ssh:/root/.ssh-host:ro
      # entrypoint 挂载:改脚本立即生效
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      # 静态节点文件(从宿主机千陌/FlClash 导出的美日智台节点;无需订阅 URL)
      - ./mihomo-conf/proxies-static.yaml:/root/.config/mihomo/proxies-static.yaml:ro

    stdin_open: true
    tty: true

# 命名卷:模型 CLI 工具链本体(容器重建/删除后仍在,免重装免重登)
volumes:
  agy-tools:
  agy-local-bin:
  agy-npm-cache:
